<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Face Tomb Editor</title>
<style>
body{background:#050505;color:#e7d29a;font-family:Arial;margin:0;padding:20px}input,textarea,select{width:100%;margin:4px 0 12px;background:#111;color:#fff;border:1px solid #444;padding:6px;box-sizing:border-box}input[type=range]{width:100%;padding:0;margin:6px 0 14px}label{display:flex;justify-content:space-between;gap:16px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#f0dca2}button{background:#e7d29a;color:#000;padding:8px 12px;border:none;margin:6px 4px 6px 0;cursor:pointer;font-weight:bold}button.secondary{background:#111;color:#e7d29a;border:1px solid #555}.card{border:1px solid #444;padding:12px;margin-bottom:12px;background:rgba(255,255,255,.025)}.subcard{border:1px solid #30291b;padding:10px;margin:8px 0 12px;background:rgba(231,210,154,.035)}h1,h2,h3{letter-spacing:.08em;text-transform:uppercase}h3{font-size:14px;margin:8px 0 10px;color:#fff1bf}small{color:#bda86f}
</style>
</head>
<body>
<h1>Face Tomb Editor</h1>
<h2>Movement</h2><div id="movement" class="card"></div><button class="secondary" onclick="resetMovement()">Reset Movement Defaults</button>
<h2>Rooms</h2><div id="rooms"></div><button onclick="addRoom()">Add Room</button><button onclick="save()">Save</button>
<script>
const DEFAULT_MOVEMENT={cameraFov:75,walkSpeed:4.8,runSpeed:8.5,mouseLookSensitivity:0.0022,joystickLookSpeed:2.65,joystickPitchSpeed:1.9,jumpHeight:5.2,gravity:13.5,joystickDeadzone:0.08,playerRadius:0.45,mainSpawnX:0,mainSpawnZ:18.6,mainSpawnYaw:180,hallwaySpawnYaw:0,glassSpawnYaw:180,barSpawnX:0,barSpawnZ:9.2,barSpawnYaw:0};
const GLASS_DEFAULTS={sides:12,towerRadius:12,roomScale:2.35,panelWidth:3.2,panelHeight:8,layers:3,verticalGap:8.15,towerHeight:24.3,wallHeight:30,roofClearance:5.7,spinSpeed:0.04,baseAtEyeLevel:true,uniformRings:true,preserveAspectRatio:true};
const ART_DEFAULTS={roomWidth:20,roomDepth:12,roomHeight:8,hallWidth:4,artWidth:4,artHeight:3,artCenterHeight:4.4,benchHeight:.62,spotlightBrightness:1.45,spotlightDistance:12,wallRepeatX:4,wallRepeatY:2,lazyRadius:34,maxLoadedArt:12};
const SOURCE_DEFAULTS={
 dome:{radius:12,maxImages:48,imageWidth:2.3,imageHeight:1.75,lightIntensity:2.1},
 observatory:{radius:12,starCount:1200,starSize:.045,maxConstellations:18,svgScale:.008,constellationOpacity:.62},
 books:{maxBooks:40,columns:10,shelfGap:1.75},
 objects:{maxObjects:8,radius:7,objectScale:1.8,lightIntensity:8},
 clouds:{windowWidth:7.2,windowHeight:4.05,windowY:4.05},
 clock:{radius:4.8},
 train:{cars:8,trainSpeed:2.2,carLength:4.4,carWidth:3.6,carHeight:3.2},
 airplane:{mapWidth:22,mapHeight:38,mapSpeed:.05,planeSize:4},
 locked:{planeCount:90,rings:5,spinSpeed:.12}
};
let rooms=[];let config={movement:{...DEFAULT_MOVEMENT}};
function defaultsFor(r){if(r.kind==='glass-tower')return GLASS_DEFAULTS;if(r.kind==='art-history-room')return ART_DEFAULTS;if(r.kind==='source-scene-room')return SOURCE_DEFAULTS[r.sourceScene]||{};return {}}
function hydrateRoom(r){r.config={...defaultsFor(r),...(r.config||{})};r.spawn=r.spawn||{};return r}
async function load(){const [scene,cfg]=await Promise.all([fetch('../api/scene.php?ts='+Date.now()).then(r=>r.json()),fetch('../api/config.php?ts='+Date.now()).then(r=>r.json()).catch(()=>({movement:{}}))]);rooms=(scene.rooms||[]).map(hydrateRoom);config={movement:{...DEFAULT_MOVEMENT,...(cfg.movement||{})}};render()}
function slider(label,key,min,max,step){const v=Number(config.movement[key]??DEFAULT_MOVEMENT[key]);const shown=step<0.01?v.toFixed(4):v.toFixed(step<0.1?2:1);return `<label><span>${label}</span><strong>${shown}</strong></label><input type="range" min="${min}" max="${max}" step="${step}" value="${v}" oninput="config.movement.${key}=parseFloat(this.value);render()">`}
function roomNumberSlider(i,label,key,min,max,step,defaults){const r=hydrateRoom(rooms[i]),fallback=defaults?.[key]??0,v=Number(r.config[key]??fallback),shown=step<0.01?v.toFixed(3):v.toFixed(step<0.1?2:1);return `<label><span>${label}</span><strong>${shown}</strong></label><input type="range" min="${min}" max="${max}" step="${step}" value="${v}" oninput="rooms[${i}].config=rooms[${i}].config||{};rooms[${i}].config.${key}=parseFloat(this.value);syncGlassTowerHeight(${i});render()">`}
function roomSpawnYawSlider(i){const r=rooms[i];r.spawn=r.spawn||{};const v=Number(r.spawn.yaw??90);return `<label><span>Spawn Rotation</span><strong>${v.toFixed(0)}</strong></label><input type="range" min="0" max="360" step="1" value="${v}" oninput="rooms[${i}].spawn=rooms[${i}].spawn||{};rooms[${i}].spawn.yaw=parseFloat(this.value);render()">`}
function roomBool(i,label,key,defaults){const r=hydrateRoom(rooms[i]),checked=(r.config[key]??defaults?.[key])?'checked':'';return `<label><span>${label}</span><strong>${checked?'ON':'OFF'}</strong></label><input type="checkbox" ${checked} onchange="rooms[${i}].config.${key}=this.checked;render()">`}
function syncGlassTowerHeight(i){const c=rooms[i].config||{};if(rooms[i].kind==='glass-tower'){const base=c.baseAtEyeLevel?1.65:0;c.towerHeight=Number((base+((c.layers||3)-1)*(c.verticalGap||8.15)+(c.panelHeight||8)).toFixed(2));if((c.wallHeight||0)<c.towerHeight+(c.roofClearance||4))c.wallHeight=Number((c.towerHeight+(c.roofClearance||4)).toFixed(2))}}
function glassControls(i){const r=hydrateRoom(rooms[i]);syncGlassTowerHeight(i);return `<div class="subcard"><h3>Glass Chapel Controls</h3>${roomNumberSlider(i,'Wall / Roof Height','wallHeight',12,80,.5,GLASS_DEFAULTS)}${roomNumberSlider(i,'Roof Clearance','roofClearance',1,20,.1,GLASS_DEFAULTS)}${roomNumberSlider(i,'Tower Radius','towerRadius',4,24,.1,GLASS_DEFAULTS)}${roomNumberSlider(i,'Room Scale','roomScale',1.2,4,.05,GLASS_DEFAULTS)}${roomNumberSlider(i,'Panel Width','panelWidth',1,8,.1,GLASS_DEFAULTS)}${roomNumberSlider(i,'Panel Height','panelHeight',2,14,.1,GLASS_DEFAULTS)}${roomNumberSlider(i,'Layers / Rings','layers',1,8,1,GLASS_DEFAULTS)}${roomNumberSlider(i,'Vertical Gap','verticalGap',2,14,.1,GLASS_DEFAULTS)}${roomNumberSlider(i,'Sides Around Tower','sides',4,24,1,GLASS_DEFAULTS)}${roomNumberSlider(i,'Spin Speed','spinSpeed',0,.2,.005,GLASS_DEFAULTS)}${roomBool(i,'Base At Eye Level','baseAtEyeLevel',GLASS_DEFAULTS)}<small>Computed tower height: ${r.config.towerHeight}. Save, then reload the viewer.</small></div>`}
function artControls(i){const r=hydrateRoom(rooms[i]);r.spawn=r.spawn||{x:0,y:1.65,z:0,yaw:90};return `<div class="subcard"><h3>Art History Controls</h3>${roomNumberSlider(i,'Artwork Width','artWidth',2,8,.1,ART_DEFAULTS)}${roomNumberSlider(i,'Artwork Height','artHeight',2,8,.1,ART_DEFAULTS)}${roomNumberSlider(i,'Artwork Height Position','artCenterHeight',2,8,.1,ART_DEFAULTS)}${roomNumberSlider(i,'Room Height','roomHeight',4,20,.5,ART_DEFAULTS)}${roomNumberSlider(i,'Bench Height','benchHeight',.2,2,.05,ART_DEFAULTS)}${roomNumberSlider(i,'Spotlight Brightness','spotlightBrightness',.2,5,.1,ART_DEFAULTS)}${roomNumberSlider(i,'Spotlight Distance','spotlightDistance',5,30,.5,ART_DEFAULTS)}${roomNumberSlider(i,'Lazy Load Radius','lazyRadius',10,80,1,ART_DEFAULTS)}${roomNumberSlider(i,'Max Loaded Art','maxLoadedArt',6,36,1,ART_DEFAULTS)}${roomSpawnYawSlider(i)}<small>Uses /AIFACES/${r.category||'ART'} and ignores wallpaper.png as artwork.</small></div>`}
function sourceSceneSelect(i){const r=rooms[i],names=Object.keys(SOURCE_DEFAULTS);return `<label><span>Source Scene</span><strong>${r.sourceScene||'dome'}</strong></label><select onchange="rooms[${i}].sourceScene=this.value;rooms[${i}].config={...SOURCE_DEFAULTS[this.value]};render()">${names.map(n=>`<option value="${n}" ${r.sourceScene===n?'selected':''}>${n}</option>`).join('')}</select>`}
function sourceControls(i){const r=hydrateRoom(rooms[i]),s=r.sourceScene||'dome',d=SOURCE_DEFAULTS[s]||{};let h=`<div class="subcard"><h3>${s} Controls</h3>${sourceSceneSelect(i)}`;
 if(s==='dome')h+=roomNumberSlider(i,'Dome Radius','radius',6,20,.1,d)+roomNumberSlider(i,'Max Images','maxImages',8,80,1,d)+roomNumberSlider(i,'Image Width','imageWidth',1,5,.1,d)+roomNumberSlider(i,'Image Height','imageHeight',1,5,.1,d)+roomNumberSlider(i,'Light Intensity','lightIntensity',.2,5,.1,d);
 if(s==='observatory')h+=roomNumberSlider(i,'Vault Radius','radius',8,22,.1,d)+roomNumberSlider(i,'Star Count','starCount',100,1800,50,d)+roomNumberSlider(i,'Star Size','starSize',.01,.15,.005,d)+roomNumberSlider(i,'Max Constellations','maxConstellations',4,40,1,d)+roomNumberSlider(i,'SVG Scale','svgScale',.002,.03,.001,d)+roomNumberSlider(i,'Constellation Opacity','constellationOpacity',.1,1,.05,d);
 if(s==='books')h+=roomNumberSlider(i,'Max Books','maxBooks',5,80,1,d)+roomNumberSlider(i,'Columns','columns',4,16,1,d)+roomNumberSlider(i,'Shelf Gap','shelfGap',1,3,.05,d);
 if(s==='objects')h+=roomNumberSlider(i,'Max Objects','maxObjects',1,16,1,d)+roomNumberSlider(i,'Reliquary Radius','radius',3,12,.1,d)+roomNumberSlider(i,'Object Scale','objectScale',.5,4,.1,d)+roomNumberSlider(i,'Spotlight Intensity','lightIntensity',1,20,.5,d);
 if(s==='clouds')h+=roomNumberSlider(i,'Window Width','windowWidth',3,11,.1,d)+roomNumberSlider(i,'Window Height','windowHeight',2,7,.1,d)+roomNumberSlider(i,'Window Center Height','windowY',2,6,.1,d);
 if(s==='clock')h+=roomNumberSlider(i,'Clock Radius','radius',2,9,.1,d);
 if(s==='train')h+=roomNumberSlider(i,'Cars','cars',3,12,1,d)+roomNumberSlider(i,'Train Speed','trainSpeed',.2,8,.1,d)+roomNumberSlider(i,'Car Length','carLength',2.5,8,.1,d)+roomNumberSlider(i,'Car Width','carWidth',2,6,.1,d)+roomNumberSlider(i,'Car Height','carHeight',2,6,.1,d);
 if(s==='airplane')h+=roomNumberSlider(i,'Map Width','mapWidth',12,40,.5,d)+roomNumberSlider(i,'Map Length','mapHeight',18,80,.5,d)+roomNumberSlider(i,'Map Speed','mapSpeed',.005,.2,.005,d)+roomNumberSlider(i,'Plane Size','planeSize',1.5,8,.1,d);
 if(s==='locked')h+=roomNumberSlider(i,'Infinite Planes','planeCount',20,120,5,d)+roomNumberSlider(i,'Mechanism Rings','rings',2,12,1,d)+roomNumberSlider(i,'Ring Spin Speed','spinSpeed',.01,.5,.01,d);
 h+=roomSpawnYawSlider(i)+`<small>Reads live assets from /AIFACES/${r.category||s.toUpperCase()} using the source scene’s native media type.</small></div>`;return h}
function render(){document.getElementById('movement').innerHTML=slider('Camera FOV','cameraFov',60,110,1)+slider('Walk Speed','walkSpeed',1,10,.1)+slider('Run Speed','runSpeed',2,15,.1)+slider('Mouse Look Sensitivity','mouseLookSensitivity',.0005,.006,.0001)+slider('Joystick Pan Speed','joystickLookSpeed',.5,5,.05)+slider('Joystick Pitch Speed','joystickPitchSpeed',.5,5,.05)+slider('Jump Height','jumpHeight',1,12,.1)+slider('Gravity','gravity',5,25,.1)+slider('Joystick Deadzone','joystickDeadzone',0,.25,.01)+slider('Player Collision Radius','playerRadius',.2,1.2,.05)+slider('Main Spawn X','mainSpawnX',-20,20,.1)+slider('Main Spawn Z','mainSpawnZ',-20,20,.1)+slider('Main Spawn Rotation','mainSpawnYaw',0,360,1)+slider('Glass Spawn Rotation','glassSpawnYaw',0,360,1)+slider('Hallway Spawn Rotation','hallwaySpawnYaw',0,360,1)+slider('Bar Spawn X','barSpawnX',-10,10,.1)+slider('Bar Spawn Z','barSpawnZ',-10,10,.1)+slider('Bar Spawn Rotation','barSpawnYaw',0,360,1)+'<small>Changes apply after saving and reloading the viewer.</small>';
 const el=document.getElementById('rooms');el.innerHTML='';rooms.forEach((r,i)=>{hydrateRoom(r);el.innerHTML+=`<div class='card'><input value='${r.id}' placeholder='Room ID' onchange='rooms[${i}].id=this.value'><input value='${r.title||""}' placeholder='Title' onchange='rooms[${i}].title=this.value'><input value='${r.category||""}' placeholder='Category (AIFACES folder)' onchange='rooms[${i}].category=this.value'><select onchange='rooms[${i}].kind=this.value;if(this.value==="glass-tower")rooms[${i}].config={...GLASS_DEFAULTS};else if(this.value==="art-history-room")rooms[${i}].config={...ART_DEFAULTS};else if(this.value==="source-scene-room"){rooms[${i}].sourceScene=rooms[${i}].sourceScene||"dome";rooms[${i}].config={...SOURCE_DEFAULTS[rooms[${i}].sourceScene]}};render()'><option ${r.kind==='bar-room'?'selected':''}>bar-room</option><option ${r.kind==='hallway-gallery'?'selected':''}>hallway-gallery</option><option ${r.kind==='glass-tower'?'selected':''}>glass-tower</option><option ${r.kind==='floorplan-gallery'?'selected':''}>floorplan-gallery</option><option ${r.kind==='art-history-room'?'selected':''}>art-history-room</option><option ${r.kind==='source-scene-room'?'selected':''}>source-scene-room</option></select><textarea placeholder='Description' onchange='rooms[${i}].description=this.value'>${r.description||""}</textarea>${r.kind==='glass-tower'?glassControls(i):''}${r.kind==='art-history-room'?artControls(i):''}${r.kind==='source-scene-room'?sourceControls(i):''}<button class='secondary' onclick='rooms.splice(${i},1);render()'>Delete</button></div>`})}
function addRoom(){rooms.push({id:'new-room',title:'New Room',category:'DOME',kind:'source-scene-room',sourceScene:'dome',spawn:{x:0,z:8,yaw:180},config:{...SOURCE_DEFAULTS.dome}});render()}
function resetMovement(){config.movement={...DEFAULT_MOVEMENT};render()}
async function save(){rooms.forEach((r,i)=>{if(r.kind==='glass-tower')syncGlassTowerHeight(i)});const res=await fetch('../api/rooms.php',{method:'POST',body:JSON.stringify({rooms,config})}).then(r=>r.json());alert(res.success?'Saved':'Save failed')}
load();
</script>
</body>
</html>
