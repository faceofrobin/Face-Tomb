<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Face Tomb Editor</title>
<style>
body{background:#050505;color:#e7d29a;font-family:Arial;margin:0;padding:20px}
input,textarea,select{width:100%;margin:4px 0;background:#111;color:#fff;border:1px solid #444;padding:6px}
input[type=range]{width:100%}
button{background:#e7d29a;color:#000;padding:8px 12px;border:none;margin:6px 4px;cursor:pointer}
.card{border:1px solid #444;padding:10px;margin-bottom:12px}
</style>
</head>
<body>
<h1>Face Tomb Editor</h1>

<h2>Movement</h2>
<div id="movement" class="card"></div>

<h2>Rooms</h2>
<div id="rooms"></div>
<button onclick="addRoom()">Add Room</button>
<button onclick="save()">Save</button>

<script>
let rooms=[];
let config={movement:{}};

async function load(){
 const [scene,cfg]=await Promise.all([
  fetch('../api/scene.php').then(r=>r.json()),
  fetch('../api/config.php').then(r=>r.json())
 ]);
 rooms=scene.rooms||[];
 config=cfg||{movement:{}};
 render();
}

function slider(label,key,min,max,step){
 const v=config.movement[key]??0;
 return `
  <label>${label}: ${v}</label>
  <input type="range" min="${min}" max="${max}" step="${step}" value="${v}"
   oninput="config.movement.${key}=parseFloat(this.value);render()">
 `;
}

function render(){
 document.getElementById('movement').innerHTML=
  slider('Walk Speed','walkSpeed',1,10,0.1)+
  slider('Run Speed','runSpeed',2,15,0.1)+
  slider('Jump Height','jumpHeight',1,12,0.1)+
  slider('Gravity','gravity',5,25,0.1)+
  slider('Look Speed','joystickLookSpeed',0.5,5,0.05)+
  slider('Pitch Speed','joystickPitchSpeed',0.5,5,0.05);

 const el=document.getElementById('rooms');
 el.innerHTML='';
 rooms.forEach((r,i)=>{
  el.innerHTML+=`<div class='card'>
  <input value='${r.id}' onchange='rooms[${i}].id=this.value'>
  <input value='${r.title||""}' onchange='rooms[${i}].title=this.value'>
  <input value='${r.category||""}' onchange='rooms[${i}].category=this.value'>
  <select onchange='rooms[${i}].kind=this.value'>
    <option ${r.kind==='hallway-gallery'?'selected':''}>hallway-gallery</option>
    <option ${r.kind==='glass-tower'?'selected':''}>glass-tower</option>
  </select>
  <textarea onchange='rooms[${i}].description=this.value'>${r.description||""}</textarea>
  <button onclick='rooms.splice(${i},1);render()'>Delete</button>
  </div>`;
 });
}

function addRoom(){rooms.push({id:'new-room',title:'New Room',category:'HALLWAY',kind:'hallway-gallery'});render()}

async function save(){
 await fetch('../api/rooms.php',{
  method:'POST',
  body:JSON.stringify({rooms,config})
 });
 alert('Saved');
}

load();
</script>
</body>
</html>
