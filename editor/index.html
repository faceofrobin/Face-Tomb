<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Face Tomb Editor</title>
<style>
body{background:#050505;color:#e7d29a;font-family:Arial;margin:0;padding:20px}
input,textarea,select{width:100%;margin:4px 0 12px;background:#111;color:#fff;border:1px solid #444;padding:6px;box-sizing:border-box}
input[type=range]{width:100%;padding:0;margin:6px 0 14px}
label{display:flex;justify-content:space-between;gap:16px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#f0dca2}
button{background:#e7d29a;color:#000;padding:8px 12px;border:none;margin:6px 4px 6px 0;cursor:pointer;font-weight:bold}
button.secondary{background:#111;color:#e7d29a;border:1px solid #555}
.card{border:1px solid #444;padding:12px;margin-bottom:12px;background:rgba(255,255,255,.025)}
.subcard{border:1px solid #30291b;padding:10px;margin:8px 0 12px;background:rgba(231,210,154,.035)}
h1,h2,h3{letter-spacing:.08em;text-transform:uppercase}
h3{font-size:14px;margin:8px 0 10px;color:#fff1bf}
small{color:#bda86f}
</style>
</head>
<body>
<h1>Face Tomb Editor</h1>
<h2>Rooms</h2>
<div id="rooms"></div>
<button onclick="save()">Save</button>
<script>
let rooms=[];
async function load(){
 const scene=await fetch('../api/scene.php').then(r=>r.json());
 rooms=scene.rooms||[];
 render();
}
function slider(i,label,key,min,max,step){
 const v=rooms[i].config?.[key]||0;
 return `<label><span>${label}</span><strong>${v}</strong></label><input type=range min=${min} max=${max} step=${step} value=${v} oninput="rooms[${i}].config=rooms[${i}].config||{};rooms[${i}].config.${key}=parseFloat(this.value);render()">`;
}
function render(){
 const el=document.getElementById('rooms');
 el.innerHTML='';
 rooms.forEach((r,i)=>{
  let extra='';
  if(r.kind==='art-history-room'){
    extra=`<div class='subcard'><h3>Art History Controls</h3>
    ${slider(i,'Artwork Width','artWidth',2,8,0.1)}
    ${slider(i,'Artwork Height','artHeight',2,8,0.1)}
    ${slider(i,'Artwork Height Position','artCenterHeight',2,8,0.1)}
    ${slider(i,'Room Height','roomHeight',4,20,0.5)}
    ${slider(i,'Bench Height','benchHeight',0.2,2,0.05)}
    ${slider(i,'Spotlight Brightness','spotlightBrightness',0.2,5,0.1)}
    ${slider(i,'Spotlight Distance','spotlightDistance',5,30,0.5)}
    ${slider(i,'Spawn Rotation','yaw',0,360,1)}
    </div>`;
  }
  el.innerHTML+=`<div class='card'>
  <input value='${r.id}' onchange='rooms[${i}].id=this.value'>
  <input value='${r.title||""}' onchange='rooms[${i}].title=this.value'>
  <select onchange='rooms[${i}].kind=this.value;render()'>
    <option ${r.kind==='art-history-room'?'selected':''}>art-history-room</option>
    <option ${r.kind==='hallway-gallery'?'selected':''}>hallway-gallery</option>
    <option ${r.kind==='bar-room'?'selected':''}>bar-room</option>
  </select>
  ${extra}
  </div>`;
 });
}
async function save(){
 await fetch('../api/rooms.php',{method:'POST',body:JSON.stringify({rooms})});
 alert('Saved');
}
load();
</script>
</body>
</html>
