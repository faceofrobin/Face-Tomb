name: Deploy Face Tomb to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Upload /tomb site files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint Tomb PHP
        run: |
          php -l app/index.php
          php -l app/source-rooms.php
          php -l app/runtime.php
          php -l api/scene.php
          php -l api/rooms.php
          php -l api/config.php

      - name: Validate generated Three.js module
        run: |
          php app/runtime.php > /tmp/tomb.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/tomb.html').read_text()
          marker = '<script type="module">'
          start = html.find(marker)
          end = html.find('</script>', start)
          if start < 0 or end < 0:
              raise SystemExit('Three.js module script not found in generated runtime')
          js = html[start + len(marker):end]
          Path('/tmp/tomb.mjs').write_text(js)
          print(f'Generated JS bytes: {len(js)}')
          PY
          node --check /tmp/tomb.mjs

      - name: Deploy to faceofrobin.com/tomb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: gator4175.hostgator.com
          username: robin@faceofrobin.com
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /tomb/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md

      - name: Smoke test live Tomb
        run: |
          sleep 4
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsSL "https://faceofrobin.com/tomb/app/?build=${GITHUB_SHA}" -o /tmp/live-tomb.html
          grep -q "Version 4 · The Archive Breathes" /tmp/live-tomb.html
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsSL "https://faceofrobin.com/tomb/api/scene.php?build=${GITHUB_SHA}" -o /tmp/live-scene.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/live-scene.json'))
          rooms = data.get('rooms', [])
          if len(rooms) < 10:
              raise SystemExit(f'Live scene API returned only {len(rooms)} rooms')
          print(f'Live Tomb responded with Version 4 and {len(rooms)} rooms.')
          PY
