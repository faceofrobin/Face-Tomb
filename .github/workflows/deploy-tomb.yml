name: Deploy Face Tomb to FTP

on:
  push:
    branches:
      - split-php-threejs-scaffold
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Upload /tomb site files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to faceofrobin.com/tomb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: gator4175.hostgator.com
          username: robin@faceofrobin.com
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /tomb/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md
