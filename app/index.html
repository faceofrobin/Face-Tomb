<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>The Face Tomb</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial,sans-serif;touch-action:none;user-select:none}#app{position:fixed;inset:0}#hud,#msg{position:fixed;z-index:5;background:rgba(0,0,0,.74);border:1px solid rgba(218,184,92,.3);padding:11px;box-shadow:0 0 25px #000}#hud{top:12px;left:12px;width:min(460px,calc(100vw - 24px));font-size:13px;line-height:1.35}#hud h1{margin:0 0 5px;color:#e7d29a;font-size:16px;letter-spacing:.16em;text-transform:uppercase}#msg{right:12px;bottom:12px;width:min(520px,calc(100vw - 24px));font-size:13px;line-height:1.35;min-height:42px}#dot{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#e7d29a;z-index:4;pointer-events:none;box-shadow:0 0 12px #e7d29a}#start{position:fixed;inset:0;display:grid;place-items:center;z-index:10;background:radial-gradient(circle,rgba(74,58,30,.5),rgba(0,0,0,.94));cursor:pointer;text-align:center;padding:24px}#start div{max-width:710px;border:1px solid rgba(218,184,92,.38);background:rgba(0,0,0,.76);padding:26px;box-shadow:0 0 60px #000}#start h2{margin:0 0 10px;letter-spacing:.18em;color:#e7d29a;text-transform:uppercase}#tools{position:fixed;top:12px;right:12px;z-index:7;display:flex;gap:8px}.pill{border:1px solid rgba(231,210,154,.48);background:rgba(218,184,92,.82);color:#130e06;border-radius:999px;padding:9px 12px;font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.pill.on{background:rgba(55,147,255,.9);color:#eef7ff}.pill.dark{background:rgba(0,0,0,.65);color:#f1dfae}
</style>
</head>
<body>
<div id="app"></div><div id="dot"></div>
<div id="hud"><h1>The Face Tomb</h1><div>WASD move · mouse look · Space jump · click relics · R returns</div><small id="stats">Loading scene API…</small></div>
<div id="tools"><button id="home" class="pill dark">Chamber</button><button id="noclip" class="pill">Noclip</button></div>
<div id="msg">The chamber is loading.</div>
<div id="start"><div><h2>Enter the Relic Chamber</h2><p>Click to begin.</p></div></div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';
const app=document.getElementById('app'),msg=document.getElementById('msg'),stats=document.getElementById('stats'),start=document.getElementById('start'),noclipBtn=document.getElementById('noclip'),homeBtn=document.getElementById('home');
const loader=new THREE.TextureLoader(),BASE_EYE=1.65;
let scene,camera,renderer,clock,root,sceneData={rooms:[],media:{}},clickable=[],colliders=[],animated=[],roomLights=[];
const state={yaw:Math.PI,pitch:0,noclip:false,room:'main',velY:0,onGround:true};const keys={};
function mat(c,r=.8){return new THREE.MeshStandardMaterial({color:c,roughness:r})}
const mats={floor:mat(0x3b3328),wall:mat(0x76664f),ceil:mat(0x24211d),gold:mat(0xb78f32,.55),stone:mat(0x8a8068),dark:mat(0x16100a),glow:new THREE.MeshStandardMaterial({color:0xe8d9a0,emissive:0xc29f34,emissiveIntensity:1.3}),wood:mat(0x4b2916)};
function addLight(l){scene.add(l);roomLights.push(l);return l}function reset(){clickable=[];colliders=[];animated=[];roomLights.forEach(l=>scene.remove(l));roomLights=[];if(root)scene.remove(root);root=new THREE.Group();scene.add(root)}
function box(x,y,z,w,h,d,m,solid=true,p=root){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);if(solid)colliders.push({x,z,w,d});return o}function cyl(x,y,z,r,h,m,solid=true,p=root){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,32),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);if(solid)colliders.push({x,z,w:r*2,d:r*2});return o}
function clickableObj(o,title,text,action){o.userData.info={title,text,action};clickable.push(o);return o}function labelSprite(text){const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');g.fillStyle='rgba(0,0,0,.72)';g.fillRect(0,0,512,128);g.strokeStyle='#e7d29a';g.strokeRect(6,6,500,116);g.fillStyle='#e7d29a';g.font='bold 34px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(String(text||'ROOM').toUpperCase(),256,64);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(5,1.25,1);return s}
function buildMain(){reset();state.room='main';scene.background=new THREE.Color(0x070605);scene.fog=new THREE.FogExp2(0x070605,.012);camera.position.set(0,BASE_EYE,16);state.yaw=Math.PI;state.pitch=0;box(0,-.06,0,44,.12,44,mats.floor,false);box(-22,5.5,0,.42,11,44,mats.wall);box(22,5.5,0,.42,11,44,mats.wall);box(0,5.5,-22,44,11,.42,mats.wall);box(0,5.5,22,44,11,.42,mats.wall);box(0,11,0,44,.12,44,mats.ceil,false);const dome=new THREE.Mesh(new THREE.SphereGeometry(22.8,48,20,0,Math.PI*2,0,Math.PI/2),mats.wall);dome.scale.y=.38;dome.position.y=10.9;root.add(dome);for(let i=0;i<8;i++){const a=i*Math.PI*2/8+Math.PI/8,x=Math.cos(a)*13.5,z=Math.sin(a)*13.5,g=new THREE.Group();g.position.set(x,0,z);root.add(g);cyl(0,.23,0,1.1,.46,mats.gold,false,g);cyl(0,4.3,0,.55,8.1,mats.stone,false,g);const orb=new THREE.Mesh(new THREE.SphereGeometry(.34,18,18),mats.glow);orb.position.y=8.8;g.add(orb);addLight(new THREE.PointLight(0xffd56d,.9,12,2)).position.set(x,8.7,z);animated.push({object:g,speed:i%2?-.18:.18});colliders.push({x,z,w:1.5,d:1.5})}clickableObj(box(0,.9,0,4.4,1.05,2.4,mats.gold,true),'The Altar','The chamber is intact.');const spots=[[0,-15],[15,0],[0,15],[-15,0],[11,-11],[11,11],[-11,11],[-11,-11]];(sceneData.rooms||[]).forEach((r,i)=>{const g=new THREE.Group();g.position.set(spots[i%spots.length][0],0,spots[i%spots.length][1]);root.add(g);cyl(0,.2,0,1.05,.4,mats.gold,false,g);const relic=new THREE.Mesh(r.kind==='bar-room'?new THREE.CylinderGeometry(.34,.52,1.7,32):new THREE.OctahedronGeometry(.85,0),r.kind==='bar-room'?new THREE.MeshPhysicalMaterial({color:0xb06b24,transparent:true,opacity:.65,roughness:.2}):mats.glow);relic.position.y=2.15;g.add(relic);const lab=labelSprite(r.title||r.id);lab.position.set(0,3.35,0);g.add(lab);animated.push({object:relic,speed:.75});clickableObj(relic,r.title||r.id,r.description||'Enter room',()=>loadRoom(r.id));colliders.push({x:g.position.x,z:g.position.z,w:2.1,d:2.1})});stats.textContent=`Main chamber · ${(sceneData.rooms||[]).length} room relics`;msg.textContent='Viewer repaired. Click a relic to enter a room.'}
function buildBar(room){reset();state.room='bar';scene.background=new THREE.Color(0x090503);scene.fog=new THREE.FogExp2(0x090503,.018);camera.position.set(0,BASE_EYE,10.5);state.yaw=Math.PI;const all=sceneData.media?.[room.category]||[],imgs=all.filter(i=>i.type==='image'),find=n=>imgs.find(i=>i.filename.toLowerCase()===n),labels=imgs.filter(i=>/^label/i.test(i.filename));const floor=find('floor.png'),wall=find('wall.png'),bar=find('bar.png');function tm(item,rx,ry,fallback){if(!item)return fallback;const t=loader.load(item.url);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return new THREE.MeshStandardMaterial({map:t,roughness:.82})}const floorMat=tm(floor,5,5,mats.floor),wallMat=tm(wall,4,2,mats.wall),barMat=tm(bar,2,1,mats.wood);box(0,-.06,0,24,.12,24,floorMat,false);box(0,4,-12,24,8,.34,wallMat,true);box(-12,4,0,.34,8,24,wallMat,true);box(12,4,0,.34,8,24,wallMat,true);box(0,8,0,24,.16,24,mats.ceil,false);box(0,1.35,4.55,10,2.55,1.4,barMat,true);box(0,2.73,4.55,10.6,.32,1.75,barMat,true);for(let r=0;r<4;r++)box(0,1.6+r*1.42,-10.9,17,.16,.58,barMat,true);addLight(new THREE.PointLight(0xffb35c,3.2,28,2)).position.set(0,5.2,1.2);addLight(new THREE.PointLight(0xffdf9e,1.7,16,2)).position.set(0,4.8,-8.8);const items=(labels.length?labels:imgs.filter(i=>!['floor.png','wall.png','bar.png'].includes(i.filename.toLowerCase()))).slice(0,36);let hero=null,paper=null;function bottle(it,s=.55){const g=new THREE.Group();const glass=new THREE.MeshPhysicalMaterial({color:0x9fdcff,transparent:true,opacity:.52,roughness:.18,transmission:.12});const fill=new THREE.MeshStandardMaterial({color:0xb06b24,transparent:true,opacity:.74,roughness:.45});[[.32,.38,1.28,.72,glass],[.2,.32,.28,1.5,glass],[.13,.15,.62,1.94,glass],[.15,.15,.16,2.33,mats.gold],[.285,.335,.72,.54,fill]].forEach(p=>{const mesh=new THREE.Mesh(new THREE.CylinderGeometry(p[0]*s,p[1]*s,p[2]*s,32),p[4]);mesh.position.y=p[3]*s;g.add(mesh)});if(it?.url){const tex=loader.load(it.url),lab=new THREE.Mesh(new THREE.PlaneGeometry(.56*s,.48*s),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));lab.position.set(0,.91*s,.385*s);g.add(lab)}return g}function paperTex(text){const c=document.createElement('canvas');c.width=768;c.height=384;const g=c.getContext('2d');g.fillStyle='#ead9b2';g.fillRect(0,0,768,384);g.strokeStyle='#6b3d18';g.lineWidth=10;g.strokeRect(18,18,732,348);g.fillStyle='#1a1008';g.textAlign='center';g.font='bold 48px Arial';g.fillText(String(text||'FACE BOTTLE').replace(/^label[-_ ]*/i,'').replace(/[-_]+/g,' ').toUpperCase().slice(0,24),384,210);return new THREE.CanvasTexture(c)}function setHero(it){if(hero)root.remove(hero);hero=bottle(it,1.05);hero.position.set(0,2.86,3.15);root.add(hero);if(paper)root.remove(paper);paper=new THREE.Mesh(new THREE.PlaneGeometry(2.9,1.45),new THREE.MeshBasicMaterial({map:paperTex(it.title),side:THREE.DoubleSide}));paper.rotation.x=-Math.PI/2;paper.position.set(-2.25,2.94,4.62);root.add(paper);msg.textContent='Selected: '+it.title}items.forEach((it,i)=>{const row=Math.floor(i/9),col=i%9,b=bottle(it,.54);b.position.set((col-4)*1.78,1.86+row*1.42,-10.35);root.add(b);clickableObj(b,it.title,'Click to place this bottle on the counter.',()=>setHero(it))});if(items[0])setHero(items[0]);const ret=new THREE.Mesh(new THREE.OctahedronGeometry(.8,0),mats.glow);ret.position.set(-8.8,1.6,8.8);root.add(ret);clickableObj(ret,'Return Relic','Back to the main chamber.',buildMain);animated.push({object:ret,speed:.8});stats.textContent=`${room.title} · ${items.length} bottles`;msg.textContent='The BAR room is open. Click a shelf bottle to place it on the counter.'}
function loadRoom(id){const r=(sceneData.rooms||[]).find(x=>x.id===id);if(!r)return;if(r.kind==='bar-room')buildBar(r);else{msg.textContent='This renderer is temporarily stubbed while BAR is restored.'}}
function rayInspect(){const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);const hit=ray.intersectObjects(clickable,true)[0];if(hit){let o=hit.object;while(o&&!o.userData?.info)o=o.parent;if(o?.userData?.info){const info=o.userData.info;msg.textContent=`${info.title} — ${info.text}`;if(info.action)info.action()}}}
function move(dt){camera.rotation.order='YXZ';camera.rotation.y=state.yaw;camera.rotation.x=state.pitch;const dir=new THREE.Vector3(),side=new THREE.Vector3();camera.getWorldDirection(dir);dir.y=0;dir.normalize();side.crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();let mv=new THREE.Vector3();if(keys.KeyW||keys.ArrowUp)mv.add(dir);if(keys.KeyS||keys.ArrowDown)mv.sub(dir);if(keys.KeyA||keys.ArrowLeft)mv.sub(side);if(keys.KeyD||keys.ArrowRight)mv.add(side);if(mv.lengthSq())mv.normalize();const speed=keys.ShiftLeft?8.5:4.8,next=camera.position.clone().addScaledVector(mv,speed*dt);if(!state.noclip){if(state.room==='main'){next.x=Math.max(-21.25,Math.min(21.25,next.x));next.z=Math.max(-21.25,Math.min(21.25,next.z))}if(state.room==='bar'){next.x=Math.max(-11.2,Math.min(11.2,next.x));next.z=Math.max(-11.2,Math.min(11.2,next.z))}for(const c of colliders){if(Math.abs(next.x-c.x)<c.w/2+.45&&Math.abs(next.z-c.z)<c.d/2+.45){next.x=camera.position.x;next.z=camera.position.z}}}camera.position.copy(next);if(!state.noclip){state.velY-=13.5*dt;camera.position.y+=state.velY*dt;if(camera.position.y<=BASE_EYE){camera.position.y=BASE_EYE;state.velY=0;state.onGround=true}}}
function bind(){addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&state.onGround){state.velY=5.2;state.onGround=false}if(e.code==='KeyR')buildMain()});addEventListener('keyup',e=>{keys[e.code]=false});document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){state.yaw-=e.movementX*.0022;state.pitch=Math.max(-1.2,Math.min(1.2,state.pitch-e.movementY*.0022))}});renderer.domElement.addEventListener('click',()=>{rayInspect();renderer.domElement.requestPointerLock?.()});start.onclick=()=>{start.style.display='none';renderer.domElement.requestPointerLock?.()};noclipBtn.onclick=()=>{state.noclip=!state.noclip;noclipBtn.classList.toggle('on',state.noclip)};homeBtn.onclick=buildMain;addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);animated.forEach(a=>a.object.rotation.y+=a.speed*dt);move(dt);renderer.render(scene,camera)}async function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,600);renderer=new THREE.WebGLRenderer({antialias:true});clock=new THREE.Clock();renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;app.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe6d2a2,0x14100b,.72));const sun=new THREE.DirectionalLight(0xffe2a8,1.15);sun.position.set(8,16,6);sun.castShadow=true;scene.add(sun);bind();try{sceneData=await fetch('../api/scene.php?ts='+Date.now()).then(r=>r.json())}catch(e){sceneData={rooms:[{id:'bar',title:'The Bar of the Face',category:'BAR',kind:'bar-room'}],media:{}}}buildMain();animate()}init();
</script>
</body></html>
