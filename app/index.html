<!-- UPDATED FACE TOMB WITH DOORS -->
<!-- Only showing key additions for brevity in this commit explanation -->
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';

// NEW STATE
let rooms = [];
let doors = [];
let currentRoom = null;
let fade = 0;
let fading = false;

// FADE OVERLAY
const fadeEl = document.createElement('div');
fadeEl.style.position='fixed';
fadeEl.style.inset='0';
fadeEl.style.background='#000';
fadeEl.style.opacity='0';
fadeEl.style.pointerEvents='none';
fadeEl.style.zIndex='20';
document.body.appendChild(fadeEl);

function startFade(callback){
  fading = true;
  let t = 0;
  const step = () => {
    t += 0.05;
    fadeEl.style.opacity = t;
    if(t >= 1){
      callback();
      fadeIn();
    } else requestAnimationFrame(step);
  };
  step();
}
function fadeIn(){
  let t = 1;
  const step = () => {
    t -= 0.05;
    fadeEl.style.opacity = t;
    if(t <= 0){
      fading = false;
    } else requestAnimationFrame(step);
  };
  step();
}

function buildRoom(room){
  const group = new THREE.Group();
  group.position.set(room.x,0,room.z);
  scene.add(group);

  const W=room.width, L=room.length, H=room.height;

  // FLOOR
  const floor = new THREE.Mesh(new THREE.BoxGeometry(W,.1,L), floorMat);
  floor.position.set(0,-.05,0);
  group.add(floor);

  // WALLS WITH DOOR CUTS
  const wallThickness = .3;

  function wallWithDoor(side){
    const door = room.doors?.find(d=>d.side===side);
    if(!door){
      // full wall
      if(side==='north') addWall(0,H/2,-L/2,W,H,wallThickness);
      if(side==='south') addWall(0,H/2,L/2,W,H,wallThickness);
      if(side==='west') addWall(-W/2,H/2,0,wallThickness,H,L);
      if(side==='east') addWall(W/2,H/2,0,wallThickness,H,L);
      return;
    }

    // split walls around door gap
    const gap = 3;
    if(side==='north'||side==='south'){
      const z = side==='north'? -L/2 : L/2;
      addWall(-W/4,H/2,z,W/2-gap,H,wallThickness);
      addWall(W/4,H/2,z,W/2-gap,H,wallThickness);
    } else {
      const x = side==='west'? -W/2 : W/2;
      addWall(x,H/2,-L/4,wallThickness,H,L/2-gap);
      addWall(x,H/2,L/4,wallThickness,H,L/2-gap);
    }

    // DOOR MESH
    const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(2.2,3,.2), goldMat);
    let dx=0,dz=0;
    if(side==='north') dz=-L/2;
    if(side==='south') dz=L/2;
    if(side==='west') dx=-W/2;
    if(side==='east') dx=W/2;
    doorMesh.position.set(dx,1.5,dz);
    doorMesh.userData.door = door;
    group.add(doorMesh);
    doors.push(doorMesh);
  }

  function addWall(x,y,z,w,h,d){
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat);
    mesh.position.set(x,y,z);
    group.add(mesh);
    colliders.push({x:room.x+x,z:room.z+z,w,d});
  }

  wallWithDoor('north');
  wallWithDoor('south');
  wallWithDoor('east');
  wallWithDoor('west');

  return group;
}

function checkDoors(){
  const pos = camera.position;
  for(const d of doors){
    const worldPos = new THREE.Vector3();
    d.getWorldPosition(worldPos);
    if(pos.distanceTo(worldPos) < 1.6){
      const door = d.userData.door;
      startFade(()=>{
        const target = rooms.find(r=>r.id===door.to);
        camera.position.set(target.x + door.spawn.x, door.spawn.y, target.z + door.spawn.z);
        state.yaw = door.spawn.yaw;
        currentRoom = target;
      });
      break;
    }
  }
}

// PATCH INTO ANIMATE
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  updateCamera(dt);
  checkDoors();
  renderer.render(scene,camera);
}

// PATCH INIT
async function init(){
  bind();
  try{
    const data=await fetch('../api/scene.php').then(r=>r.json());
    rooms = data.scene?.rooms || [];

    rooms.forEach(r=>buildRoom(r));

    currentRoom = rooms[0];

    stats.textContent = `Loaded ${rooms.length} rooms.`;
  }catch(e){
    console.error(e);
  }
  animate();
}

init();
</script>
