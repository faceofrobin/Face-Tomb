function buildMain(){reset();state.room='main';scene.background=new THREE.Color(0x070605);scene.fog=new THREE.FogExp2(0x070605,.012);setSpawn(cfg('mainSpawnX'),cfg('mainSpawnZ'),cfg('mainSpawnYaw'));box(0,-.06,0,44,.12,44,mats.floor,false);box(-22,5.5,0,.42,11,44,mats.wall);box(22,5.5,0,.42,11,44,mats.wall);box(0,5.5,-22,44,11,.42,mats.wall);box(0,5.5,22,44,11,.42,mats.wall);box(0,11,0,44,.12,44,mats.ceil,false);const dome=new THREE.Mesh(new THREE.SphereGeometry(22.8,48,20,0,Math.PI*2,0,Math.PI/2),mats.wall);dome.scale.y=.38;dome.position.y=10.9;root.add(dome);for(let i=0;i<8;i++){const a=i*Math.PI*2/8+Math.PI/8,x=Math.cos(a)*13.5,z=Math.sin(a)*13.5,g=new THREE.Group();g.position.set(x,0,z);root.add(g);cyl(0,.23,0,1.1,.46,mats.gold,false,g);cyl(0,4.3,0,.55,8.1,mats.stone,false,g);const orb=new THREE.Mesh(new THREE.SphereGeometry(.34,18,18),mats.glow);orb.position.y=8.8;g.add(orb);addLight(new THREE.PointLight(0xffd56d,.9,12,2)).position.set(x,8.7,z);animated.push({object:g,speed:i%2?-.18:.18});colliders.push({x,z,w:1.5,d:1.5})}clickObj(box(0,.9,0,4.4,1.05,2.4,mats.gold,true),'The Altar','The chamber is intact.');const spots=[[0,-15],[15,0],[0,15],[-15,0],[11,-11],[11,11],[-11,11],[-11,-11]];(sceneData.rooms||[]).forEach((r,i)=>{const g=new THREE.Group();g.position.set(spots[i%spots.length][0],0,spots[i%spots.length][1]);root.add(g);cyl(0,.2,0,1.05,.4,mats.gold,false,g);const geo=r.kind==='bar-room'?new THREE.CylinderGeometry(.34,.52,1.7,32):r.kind==='glass-tower'?new THREE.OctahedronGeometry(.85,0):new THREE.TorusKnotGeometry(.56,.14,72,10);const material=r.kind==='bar-room'?new THREE.MeshPhysicalMaterial({color:0xb06b24,transparent:true,opacity:.65,roughness:.2}):r.kind==='glass-tower'?mats.glass:mats.glow;const relic=new THREE.Mesh(geo,material);relic.position.y=2.15;g.add(relic);const lab=labelSprite(r.title||r.id);lab.position.set(0,3.35,0);g.add(lab);animated.push({object:relic,speed:.75});clickObj(relic,r.title||r.id,r.description||'Enter room',()=>loadRoom(r. function buildBar(room){reset();state.room='bar';scene.background=new THREE.Color(0x090503);scene.fog=new THREE.FogExp2(0x090503,.018);setSpawn(cfg('barSpawnX'),cfg('barSpawnZ'),cfg('barSpawnYaw'));const all=sceneData.media?.[room.category]||[],imgs=all.filter(i=>i.type==='image'),audio=all.find(i=>i.type==='audio'),find=n=>imgs.find(i=>i.filename.toLowerCase()===n),labels=imgs.filter(i=>/^label/i.test(i.filename));const floor=find('floor.png'),wall=find('wall.png'),bar=find('bar.png');const floorMat=itemMat(floor,5,5,mats.floor),wallMat=itemMat(wall,4,2,mats.wall),barMat=itemMat(bar,2,1,mats.wood);box(0,-.06,0,24,.12,24,floorMat,false);box(0,4,-12,24,8,.34,wallMat,true);box(-12,4,0,.34,8,24,wallMat,true);box(12,4,0,.34,8,24,wallMat,true);box(0,8,0,24,.16,24,mats.ceil,false);box(0,1.35,4.55,10,2.55,1.4,barMat,true);box(0,2.73,4.55,10.6,.32,1.75,barMat,true);for(let r=0;r<4;r++)box(0,1.6+r*1.42,-10.9,17,.16,.58,barMat,true);addLight(new THREE.PointLight(0xffb35c,3.2,28,2)).position.set(0,5.2,1.2);addLight(new THREE.PointLight(0xffdf9e,1.7,16,2)).position.set(0,4.8,-8.8);if(audio)playRoomAudio(audio.url,room.config?.musicVolume??.14);const items=(labels.length?labels:imgs.filter(i=>!['floor.png','wall.png','bar.png'].includes(i.filename.toLowerCase()))).slice(0,36);let hero=null,paper=null;function bottle(it,s=.55){const g=new THREE.Group();const glass=new THREE.MeshPhysicalMaterial({color:0x9fdcff,transparent:true,opacity:.52,roughness:.18,transmission:.12}),fill=new THREE.MeshStandardMaterial({color:0xb06b24,transparent:true,opacity:.74,roughness:.45});[[.32,.38,1.28,.72,glass],[.2,.32,.28,1.5,glass],[.13,.15,.62,1.94,glass],[.15,.15,.16,2.33,mats.gold],[.285,.335,.72,.54,fill]].forEach(p=>{const mesh=new THREE.Mesh(new THREE.CylinderGeometry(p[0]*s,p[1]*s,p[2]*s,32),p[4]);mesh.position.y=p[3]*s;g.add(mesh)});if(it?.url){const lab=new THREE.Mesh(new THREE.PlaneGeometry(.56*s,.48*s),new THREE.MeshBasicMaterial({map:tex(it.url),transparent:true,side:THREE.DoubleSide}));lab.position.set(0,.91*s,.385*s);g.add(lab)}return g}function paperTex(text){const c=document.createElement('canvas');c.width=768;c.height=384;const g=c.getContext('2d');g.fillStyle='#ead9b2';g.fillRect(0,0,768,384);g.strokeStyle='#6b3d18';g.lineWidth=10;g.strokeRect(18,18,732,348);g.fillStyle='#1a1008';g.textAlign='center';g.font='bold 48px Arial';g.fillText(String(text||'FACE BOTTLE').replace(/^label[-_ ]*/i,'').replace(/[-_]+/g,' ').toUpperCase().slice(0,24),384,210);return new THREE.CanvasTexture(c)}function setHero(it){if(hero){root.remove(hero);disposeObj(hero)}hero=bottle(it,1.05);hero.position.set(0,2.86,3.15);root.add(hero);if(paper){root.remove(paper);disposeObj(paper)}paper=new THREE.Mesh(new THREE.PlaneGeometry(2.9,1.45),new THREE.MeshBasicMaterial({map:paperTex(it.title),side:THREE.DoubleSide}));paper.rotation.x=-Math.PI/2;paper.position.set(-2.25,2.94,4.62);root.add(paper);msg.textContent='Selected: '+it.title}items.forEach((it,i)=>{const row=Math.floor(i/9),col=i%9,b=bottle(it,.54);b.position.set((col-4)*1.78,1.86+row*1.42,-10.35);root.add(b);clickObj(b,it.title,'Click or tap to place this bottle on the counter.',()=>setHero(it))});if(items[0])setHero(items[0]);const ret=new THREE.Mesh(new THREE.OctahedronGeometry(.8,0),mats.glow);ret.position.set(-8.8,1.6,8.8);root.add(ret);clickObj(ret,'Return Relic','Back to the main chamber.',buildMain);animated.push({object:ret,speed:.8});stats.textContent=`${room.title} · ${items.length} bottles`;msg.textContent='The BAR room is open. Room assets unload when you leave.'}
function loadRoom(id){const r=(sceneData.rooms||[]).find(x=>x.id===id);if(!r)return;if(r.kind==='bar-room')buildBar(r);else if(r.kind==='hallway-gallery')buildHallway(r);else if(r.kind==='glass-tower')buildGlass(r);else msg.textContent='No renderer for '+r.kind}
function rayInspect(){const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);const hit=ray.intersectObjects(clickable,true)[0];if(hit){let o=hit.object;while(o&&!o.userData?.info)o=o.parent;if(o?.userData?.info){const info=o.userData.info;msg.textContent=`${info.title} — ${info.text}`;if(info.action)info.action()}}}
function jump(){if(state.onGround){state.velY=cfg('jumpHeight');state.onGround=false}}
function move(dt){camera.rotation.order='YXZ';state.yaw-=joy.look.x*cfg('joystickLookSpeed')*dt;state.pitch=Math.max(-1.2,Math.min(1.2,state.pitch-joy.look.y*cfg('joystickPitchSpeed')*dt));camera.rotation.y=state.yaw;camera.rotation.x=state.pitch;const dir=new THREE.Vector3(),side=new THREE.Vector3();camera.getWorldDirection(dir);dir.y=0;dir.normalize();side.crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();let mv=new THREE.Vector3();if(keys.KeyW||keys.ArrowUp)mv.add(dir);if(keys.KeyS||keys.ArrowDown)mv.sub(dir);if(keys.KeyA||keys.ArrowLeft)mv.sub(side);if(keys.KeyD||keys.ArrowRight)mv.add(side);mv.addScaledVector(dir,-joy.move.y);mv.addScaledVector(side,joy.move.x);if(mv.lengthSq())mv.normalize();const speed=keys.ShiftLeft?cfg('runSpeed'):cfg('walkSpeed'),next=camera.position.clone().addScaledVector(mv,speed*dt);if(!state.noclip){if(state.room==='main'){next.x=Math.max(-21.25,Math.min(21.25,next.x));next.z=Math.max(-21.25,Math.min(21.25,next.z))}else if(state.room==='bar'){next.x=Math.max(-11.2,Math.min(11.2,next.x));next.z=Math.max(-11.2,Math.min(11.2,next.z))}else if(state.room==='hallway'){next.x=Math.max(-3.45,Math.min(3.45,next.x))}else if(state.room==='glass'){const h=(sceneData.rooms.find(r=>r.id==='glass')?.config?.towerRadius||10)*(sceneData.rooms.find(r=>r.id==='glass')?.config?.roomScale||2)-.75;next.x=Math.max(-h,Math.min(h,next.x));next.z=Math.max(-h,Math.min(h,next.z))}for(const c of colliders){if(Math.abs(next.x-c.x)<c.w/2+cfg('playerRadius')&&Math.abs(next.z-c.z)<c.d/2+cfg('playerRadius')){next.x=camera.position.x;next.z=camera.position.z}}}camera.position.copy(next);if(!state.noclip){state.velY-=cfg('gravity')*dt;camera.position.y+=state.velY*dt;if(camera.position.y<=BASE_EYE){camera.position.y=BASE_EYE;state.velY=0;state.onGround=true}}}
function bindTouchButton(btn,onDown,onUp){btn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();onDown()});['pointerup','pointercancel','pointerleave'].forEach(t=>btn.addEventListener(t,e=>{e.preventDefault();e.stopPropagation();onUp?.()}));btn.addEventListener('contextmenu',e=>e.preventDefault())}
function bindJoystick(el,target){const stick=el.querySelector('.stick');let active=null;function set(e){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,limit=r.width*.36;let dx=e.clientX-cx,dy=e.clientY-cy,dist=Math.hypot(dx,dy);if(dist>limit){dx=dx/dist*limit;dy=dy/dist*limit}const dead=cfg('joystickDeadzone');target.x=Math.abs(dx/limit)<dead?0:dx/limit;target.y=Math.abs(dy/limit)<dead?0:dy/limit;stick.style.transform=`translate(${dx}px,${dy}px)`}function release(e){if(active!==e.pointerId)return;e.preventDefault();e.stopPropagation();active=null;target.x=0;target.y=0;stick.style.transform='translate(0,0)';el.releasePointerCapture?.(e.pointerId)}el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();active=e.pointerId;el.setPointerCapture?.(e.pointerId);set(e)});el.addEventListener('pointermove',e=>{if(active===e.pointerId){e.preventDefault();e.stopPropagation();set(e)}});el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);el.addEventListener('contextmenu',e=>e.preventDefault())}
function bind(){addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')jump();if(e.code==='KeyR')buildMain()});addEventListener('keyup',e=>{keys[e.code]=false});document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){state.yaw-=e.movementX*cfg('mouseLookSensitivity');state.pitch=Math.max(-1.2,Math.min(1.2,state.pitch-e.movementY*cfg('mouseLookSensitivity')))}});renderer.domElement.addEventListener('click',()=>{rayInspect();renderer.domElement.requestPointerLock?.()});start.onclick=()=>{start.style.display='none';renderer.domElement.requestPointerLock?.()};noclipBtn.onclick=()=>{state.noclip=!state.noclip;noclipBtn.classList.toggle('on',state.noclip)};homeBtn.onclick=buildMain;bindJoystick(moveJoy,joy.move);bindJoystick(lookJoy,joy.look);bindTouchButton(mobileJump,jump,()=>{});bindTouchButton(mobileUse,rayInspect,()=>{});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);animated.forEach(a=>a.object.rotation.y+=a.speed*dt);move(dt);renderer.render(scene,camera)}
async function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,600);renderer=new THREE.WebGLRenderer({antialias:true});clock=new THREE.Clock();renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;app.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe6d2a2,0x14100b,.72));const sun=new THREE.DirectionalLight(0xffe2a8,1.15);sun.position.set(8,16,6);sun.castShadow=true;scene.add(sun);bind();try{const [sceneRes,configRes]=await Promise.all([fetch('../api/scene.php?ts='+Date.now()).then(r=>r.json()),fetch('../api/config.php?ts='+Date.now()).then(r=>r.json()).catch(()=>({movement:{}}))]);sceneData=sceneRes;movementConfig={...DEFAULT_MOVEMENT,...(configRes.movement||{})}}catch(e){sceneData={rooms:[{id:'hallway',title:'Le Couloir du Visage',category:'HALLWAY',kind:'hallway-gallery'},{id:'glass',title:'The Glass Chapel',category:'GLASS',kind:'glass-tower',audio:'https://faceofrobin.com/AIFACES/GLASS/praise.mp3'},{id:'bar',title:'The Bar of the Face',category:'BAR',kind:'bar-room'}],media:{}};movementConfig={...DEFAULT_MOVEMENT}}buildMain();animate()}
init();
